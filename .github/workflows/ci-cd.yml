name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [inventory-service, order-service, gateway-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install parent POM
        run: mvn -q -N install

      - name: Build and test ${{ matrix.service }}
        run: mvn -q -pl ${{ matrix.service }} test

  docker-publish:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [inventory-service, order-service, gateway-service]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}

  k8s-deploy-verify:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images locally
        run: |
          docker build -t inventory-service:local -f inventory-service/Dockerfile .
          docker build -t order-service:local -f order-service/Dockerfile .
          docker build -t gateway-service:local -f gateway-service/Dockerfile .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ecommerce-ci

      - name: Load images into kind
        run: |
          kind load docker-image inventory-service:local --name ecommerce-ci
          kind load docker-image order-service:local --name ecommerce-ci
          kind load docker-image gateway-service:local --name ecommerce-ci

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/inventory-service --timeout=180s
          kubectl rollout status deployment/order-service --timeout=180s
          kubectl rollout status deployment/gateway-service --timeout=180s

      - name: Show cluster state
        run: |
          kubectl get pods -o wide
          kubectl get svc

      - name: Verify end-to-end flow through the gateway
        run: |
          kubectl port-forward svc/gateway-service 8080:8080 &
          sleep 5
          echo "--- list products ---"
          curl -sf http://localhost:8080/api/inventory/products
          echo
          echo "--- place an order ---"
          curl -sf -X POST http://localhost:8080/api/orders \
            -H "Content-Type: application/json" \
            -d '{"sku":"SKU-WIDGET-001","quantity":2}'
          echo

      - name: Dump pod logs on failure
        if: failure()
        run: |
          kubectl get pods
          kubectl logs -l app=inventory-service --tail=100 || true
          kubectl logs -l app=order-service --tail=100 || true
          kubectl logs -l app=gateway-service --tail=100 || true
